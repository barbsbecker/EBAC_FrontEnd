<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Cadastro</title>

  <!-- Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Seu CSS -->
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Cadastro</h2>
    <form>
      <!-- Nome -->
<div class="mb-3">
    <label for="nome" class="form-label">Nome</label>
    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
    <div class="invalid-feedback">Por favor, preencha o nome.</div>
  </div>
  
  <!-- E-mail -->
  <div class="mb-3">
    <label for="email" class="form-label">E-mail</label>
    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
    <div class="invalid-feedback">Por favor, insira um e-mail válido.</div>
  </div>
  
  <!-- Telefone -->
  <div class="mb-3">
    <label for="telefone" class="form-label">Telefone</label>
    <input type="tel" class="form-control" id="telefone" placeholder="(xx) xxxxx-xxxx" pattern="[0-9\s()-]+" required>
    <div class="invalid-feedback">Por favor, preencha o telefone.</div>
  </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </div>

  <!-- Bootstrap JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Seu JS -->
  <script src="script.js"></script>
</body>
</html>
